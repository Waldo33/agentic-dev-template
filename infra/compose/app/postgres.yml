# Postgres приложений. Доступен только контейнерам в сети kamal по имени lab-postgres.
name: lab-postgres
services:
  postgres:
    image: postgres:17.6-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - /var/lib/lab/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [kamal]
networks:
  kamal:
    external: true
