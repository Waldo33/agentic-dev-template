# Сервер наблюдаемости: ClickHouse (логи, метрики, аналитика), Grafana (панели и тревоги),
# Bugsink (ошибки), Gatus (доступность и статус-страница), Flipt (фича-флаги) за Caddy с Let's Encrypt.
# Секреты — в /etc/lab/obs/secrets.env (генерирует Ansible), конфиги с секретами рендерит Ansible в /opt/lab/obs.
name: lab-obs
services:
  caddy:
    image: caddy:2-alpine
    container_name: lab-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./home:/srv/home:ro
      - /var/lib/lab/obs/caddy:/data
    depends_on: [clickhouse, grafana, bugsink, gatus, flipt]

  clickhouse:
    image: clickhouse/clickhouse-server:26.10.3.7-alpine
    container_name: lab-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CH_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CH_WRITER_PASSWORD: ${CH_WRITER_PASSWORD}
      CH_READER_PASSWORD: ${CH_READER_PASSWORD}
    volumes:
      - /var/lib/lab/obs/clickhouse:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d/lab.xml:/etc/clickhouse-server/config.d/lab.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "admin", "--password", "${CH_ADMIN_PASSWORD}", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.3.0
    container_name: lab-grafana
    restart: unless-stopped
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${BASE_DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
      CH_READER_PASSWORD: ${CH_READER_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - /var/lib/lab/obs/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    depends_on: [clickhouse]

  bugsink:
    image: bugsink/bugsink:2
    container_name: lab-bugsink
    restart: unless-stopped
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      CREATE_SUPERUSER: admin:${BUGSINK_ADMIN_PASSWORD}
      PORT: "8000"
      BASE_URL: https://errors.${BASE_DOMAIN}
      BEHIND_HTTPS_PROXY: "true"
    volumes:
      - /var/lib/lab/obs/bugsink:/data

  gatus:
    image: twinproduction/gatus:latest
    container_name: lab-gatus
    restart: unless-stopped
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - /var/lib/lab/obs/gatus:/data

  flipt:
    image: docker.flipt.io/flipt/flipt:v2
    container_name: lab-flipt
    restart: unless-stopped
    command: ["/flipt", "server", "--config", "/etc/flipt/config.yml"]
    volumes:
      - ./flipt/config.yml:/etc/flipt/config.yml:ro
      - /var/lib/lab/obs/flipt:/var/opt/flipt
